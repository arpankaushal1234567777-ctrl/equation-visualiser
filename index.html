<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Equation Visualizer</title>

<link rel="stylesheet" href="style.css">

<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>

</head>

<body>

<div class="container">

<h1>Equation Visualizer</h1>

<p>Enter equation using x</p>

<input id="equation" type="text" value="x*2+17">

<div class="buttons">
<button onclick="plotGraph('line')">Line Graph</button>
<button onclick="plotGraph('scatter')">Scatter Plot</button>
<button onclick="clearGraph()">Clear</button>
</div>

<div id="graph"></div>

</div>

<script src="script.js"></script>

</body>
</html>
